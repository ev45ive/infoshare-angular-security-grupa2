# Fixture do review. Nie jest uruchamiany przez ten projekt.
name: document-preview
on: pull_request
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test

# W jobie nie ma sekretu deployu ani uprawnień zapisu.
# Promocja artefaktu wymaga osobnego, zaufanego procesu po merge.
